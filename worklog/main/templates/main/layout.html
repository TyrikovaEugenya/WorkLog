<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %} {% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css'%}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css">
</head>
<body>
    <header></header>
    <aside>
        <h3>Navigation</h3>
        <ul>
            <a href="{% url 'home' %}"><li><i class="fa-solid fa-house"></i>Main page</li></a>
            {% if request.user.is_authenticated %}
                {% if request.user.role == 'manager' %}
                    <a href="{% url 'worklogs' %}"><li><i class="fa-solid fa-file"></i>Worklogs</li></a>
                {% endif %}
                <a href="{% url 'create_worklog' %}"><li><button class="btn btn-info">Add worklog</button></li></a>
            {% endif %}
            {% if not request.user.is_authenticated %}
                <a href="{% url 'login' %}"><li><button class="btn btn-info">Log in</button></li></a>
            {% endif %}
        </ul>
    </aside>
    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
